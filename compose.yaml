name: kitepost

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  site:
    <<: *hardening
    build: { context: ., dockerfile: docker/site/Dockerfile }
    environment:
      APP_URL: ${APP_URL:-app/}
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    ports: ["${BIND_ADDR:-127.0.0.1}:${SITE_PORT:-8081}:8080"]

  app:
    <<: *hardening
    build: { context: ., dockerfile: docker/app/Dockerfile }
    environment:
      BRIDGE_URL: ${BRIDGE_URL:-../bridge}
      DEFAULT_RELAY: ${DEFAULT_RELAY:-nine.testrun.org}
      CONNECT_SRC: ${CONNECT_SRC:-}
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    ports: ["${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8082}:8080"]

  bridge:
    <<: *hardening
    build: { context: bridge }
    environment:
      ALLOWED_HOSTS: ${BRIDGE_ALLOWED_HOSTS:-}
      ALLOWED_ORIGINS: ${BRIDGE_ALLOWED_ORIGINS:-}
      ALLOWED_PORTS: ${BRIDGE_ALLOWED_PORTS:-993,465}
      MAX_CONNECTIONS_PER_IP: ${BRIDGE_MAX_CONNECTIONS_PER_IP:-16}
      HOST_MAP: ${BRIDGE_HOST_MAP:-}
    ports: ["${BIND_ADDR:-127.0.0.1}:${BRIDGE_PORT:-8083}:8080"]

  # One-time invite links that create accounts on a chatmail relay on this host:
  # `docker compose --profile invite up -d`.
  invite:
    <<: *hardening
    profiles: [invite]
    build:
      context: invite
      args:
        VMAIL_UID: ${VMAIL_UID:-996}
        VMAIL_GID: ${VMAIL_GID:-996}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      ADMIN_TOKEN: ${INVITE_ADMIN_TOKEN:-}
      APP_URL: ${INVITE_APP_URL:-../app/}
      PUBLIC_URL: ${INVITE_PUBLIC_URL:-}
      SITE_NAME: ${INVITE_SITE_NAME:-}
    volumes:
      - ${CHATMAIL_MAILBOXES_DIR:-/srv/chatmail/data/mail/mail/${MAIL_DOMAIN:-unset}}:/mailboxes
      - invite_data:/data
    ports: ["${BIND_ADDR:-127.0.0.1}:${INVITE_PORT:-8084}:8080"]

  # Optional all-in-one TLS frontend: `docker compose --profile caddy up -d`.
  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [site, app, bridge]

volumes:
  invite_data:
  caddy_data:
  caddy_config:
