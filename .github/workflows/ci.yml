name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main publish images and must not be cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core (Rust/WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo and wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            tools
          key: cargo-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
          restore-keys: cargo-

      - name: Install Rust toolchain
        working-directory: core
        run: rustup toolchain install

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm

      - name: Test
        working-directory: core
        run: cargo test --release --workspace

      - name: Build WASM
        run: ./build-wasm.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: web/src/wasm
          retention-days: 3

  web:
    name: Web client
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: web/src/wasm

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type-check and build
        working-directory: web
        run: pnpm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  services:
    name: Bridge and invite service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: invite/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Bridge
        working-directory: bridge
        run: |
          pnpm install --frozen-lockfile
          node --check server.mjs

      - name: Invite service
        working-directory: invite
        run: |
          pnpm install --frozen-lockfile
          node --check server.mjs
          node --test

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # build cache for publish, written only on pushes to main
    env:
      CACHE_REF: ghcr.io/${{ github.repository }}-${{ matrix.image }}:buildcache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: site, context: ., dockerfile: docker/site/Dockerfile }
          - { image: app, context: ., dockerfile: docker/app/Dockerfile }
          - { image: bridge, context: bridge, dockerfile: bridge/Dockerfile }
          - { image: invite, context: invite, dockerfile: invite/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
            type=gha,scope=${{ matrix.image }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.image }}
            ${{ github.event_name == 'push' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

  e2e:
    name: End-to-end (local chatmail relay + Delta Chat core)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: bridge/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install test tooling
        run: |
          (cd bridge && pnpm install --frozen-lockfile)
          python -m venv work/venv
          work/venv/bin/pip install -r e2e/requirements.txt
          work/venv/bin/playwright install --with-deps chromium firefox

      - name: Start local chatmail relay
        run: docker compose -f e2e/relay/compose.yaml up -d --build --wait

      - name: End-to-end tests
        # Firefox too: it renders some things differently, e.g. ships an older emoji font.
        run: |
          work/venv/bin/pytest e2e -n 4 --browser chromium --browser firefox --junitxml=work/test-results/junit.xml
          work/venv/bin/pytest e2e -m exclusive --browser chromium --browser firefox --junitxml=work/test-results/junit-exclusive.xml

      - name: Traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: work/test-results
          retention-days: 7

      - name: Relay logs
        if: failure()
        run: |
          docker compose -f e2e/relay/compose.yaml logs --no-color | tail -n 300
          docker exec kitepost-test-chatmail journalctl --no-pager -n 200 || true

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic

  # Only after every other job passed, and only for main; release.yml promotes these images for version tags.
  publish:
    name: Publish ${{ matrix.image }}
    needs: [core, web, services, docker, e2e, zizmor]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push the images to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: site, context: ., dockerfile: docker/site/Dockerfile }
          - { image: app, context: ., dockerfile: docker/app/Dockerfile }
          - { image: bridge, context: bridge, dockerfile: bridge/Dockerfile }
          - { image: invite, context: invite, dockerfile: invite/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha,format=long

      # Only the registry cache: the gha cache can be written by any job on main, including third-party actions.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.image }}:buildcache
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
