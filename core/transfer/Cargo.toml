[package]
name = "kitepost-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# Must stay protocol compatible with the iroh version of Delta Chat core.
iroh = { version = "=0.35.0", default-features = false }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
