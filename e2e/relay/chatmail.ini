[params]
mail_domain = _chatmail.test
# Advertise the plain-HTTP relay of the `iroh` service, reachable from the test host.
iroh_relay = http://127.0.0.1:3340
# The tests send many messages within seconds; the defaults allow a burst of 10.
max_user_send_per_minute = 600
max_user_send_burst_size = 100
