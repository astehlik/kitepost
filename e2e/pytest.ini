[pytest]
# Run from the repository root: work/venv/bin/pytest e2e
addopts = -p no:cacheprovider --tracing retain-on-failure --screenshot only-on-failure --output work/test-results
# Last resort for waits without their own timeout, e.g. a stuck RPC call; a test takes about 5 s.
timeout = 90
markers =
    local_relay: needs the local test relay from e2e/relay (skipped without RELAY_IP)
# Raised by pytest-base-url, a dependency of pytest-playwright.
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
