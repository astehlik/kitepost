# Locations for the Kitepost services, included into chatmail's HTTPS server.
# Chatmail runs with host networking, so the published ports on 127.0.0.1 are reachable.
# Exact and longer prefix matches win over chatmail's own `location /`.
# Add via the chatmail role's `chatmail_nginx_locations`, or mount into /etc/nginx/custom.d.
#
# Chatmail's port 443 stream proxy does not pass client addresses on, so every client appears as
# 127.0.0.1 here: raise BRIDGE_MAX_CONNECTIONS_PER_IP accordingly, e.g. to 500.

location = / {
    proxy_pass http://127.0.0.1:8081;
}
location = /style.css { proxy_pass http://127.0.0.1:8081; }
location = /icon.svg  { proxy_pass http://127.0.0.1:8081; }

location = /app { return 308 /app/; }
location /app/ {
    proxy_pass http://127.0.0.1:8082/;
}

location /bridge {
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location = /join { return 308 /join/; }
location /join/ {
    proxy_pass http://127.0.0.1:8084/;
    proxy_set_header Host $host;
}
